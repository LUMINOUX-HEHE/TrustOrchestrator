<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Orchestrator</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#d7dce4; --dim:#8b93a3; --acc:#4f8cff; --ok:#3ddc84; --bad:#ff5f56; --warn:#ffbd2e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 ui-monospace,Consolas,monospace; }
  header { display:flex; gap:12px; align-items:center; padding:12px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 16px 0 0; color:#fff; }
  input, select, textarea, button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; }
  input:focus, select:focus, textarea:focus { outline:1px solid var(--acc); }
  button { cursor:pointer; }
  button:hover { border-color:var(--acc); }
  nav { display:flex; gap:4px; }
  nav button { border:none; color:var(--dim); }
  nav button.active { color:var(--acc); }
  main { padding:20px; max-width:1100px; margin:0 auto; }
  section { display:none; }
  section.active { display:block; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; margin:12px 0; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; cursor:pointer; }
  .card:hover { border-color:var(--acc); }
  .card h3 { margin:0 0 6px; font-size:14px; }
  .card .stat { color:var(--dim); font-size:12px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; }
  .detected { background:#3a1412; color:var(--bad); border:1px solid var(--bad); }
  .healthy { background:#12331f; color:var(--ok); border:1px solid var(--ok); }
  table { width:100%; border-collapse:collapse; margin:12px 0; font-size:12px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:normal; text-transform:uppercase; font-size:11px; }
  .form-row { display:flex; gap:8px; margin:8px 0; flex-wrap:wrap; }
  .form-row input, .form-row select { flex:1; min-width:140px; }
  .muted { color:var(--dim); }
  .err { color:var(--bad); }
  .ok { color:var(--ok); }
  pre { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; overflow:auto; font-size:12px; max-height:400px; }
  .hash { color:var(--dim); font-size:11px; }
  #token { min-width:340px; }
</style>
</head>
<body>
<header>
  <h1>Trust Orchestrator</h1>
  <input id="token" type="password" placeholder="API token" spellcheck="false">
  <button onclick="login()">Connect</button>
  <nav>
    <button data-tab="overview" class="active" onclick="tab('overview')">Overview</button>
    <button data-tab="org" onclick="tab('org')">Org</button>
    <button data-tab="audit" onclick="tab('audit')">Audit</button>
    <button data-tab="users" onclick="tab('users')">Users</button>
    <button data-tab="webhooks" onclick="tab('webhooks')">Webhooks</button>
    <button data-tab="metrics" onclick="tab('metrics')">Metrics</button>
    <button data-tab="backup" onclick="tab('backup')">Backup</button>
  </nav>
</header>
<main>
  <div id="flash" class="muted"></div>

  <section id="tab-overview" class="active">
    <div class="form-row"><input id="new-org" placeholder="org name"><button onclick="createOrg()">Create org</button></div>
    <div id="org-cards" class="cards"></div>
  </section>

  <section id="tab-org">
    <div class="form-row">
      <select id="org-select" onchange="loadOrg()"></select>
      <button onclick="getKeys()">Shard ceremony key</button>
      <button class="err" onclick="deleteOrg()">Delete org</button>
    </div>
    <div id="org-head"></div>
    <div class="form-row">
      <input id="i-cert" placeholder="cert_id"><input id="i-id" placeholder="identity"><input id="i-via" placeholder="via (optional)">
      <button onclick="issueCert()">Issue</button>
      <input id="r-cert" placeholder="cert_id to revoke"><button onclick="revokeCert()">Revoke</button>
    </div>
    <div class="form-row">
      <input id="s-node" placeholder="node_id (W1..W5)"><input id="s-score" type="number" placeholder="score" value="0">
      <input id="s-bad" type="number" placeholder="bad_index (optional)"><button onclick="postScore()">Post score</button>
    </div>
    <div class="form-row">
      <textarea id="shards" rows="3" placeholder='recover shards JSON: [{"x":1,"y":"...","len":32}, ...]' style="flex:3"></textarea>
      <button onclick="recover()">Recover</button>
    </div>
    <h3>Timeline</h3>
    <table id="timeline"></table>
    <h3>Trust state</h3>
    <table id="state"></table>
  </section>

  <section id="tab-audit">
    <div class="form-row">
      <input id="a-org" placeholder="org"><input id="a-type" placeholder="type (ISSUE/REVOKE/...)">
      <input id="a-identity" placeholder="identity"><input id="a-cert" placeholder="cert_id">
      <button onclick="audit()">Search</button>
    </div>
    <div id="audit-results"></div>
  </section>

  <section id="tab-users">
    <div class="form-row">
      <input id="u-id" placeholder="user id"><select id="u-role"><option>operator</option><option>auditor</option><option>viewer</option><option>admin</option></select>
      <input id="u-orgs" placeholder="orgs (comma, empty=all)"><button onclick="createUser()">Create user</button>
    </div>
    <table id="users"></table>
  </section>

  <section id="tab-webhooks">
    <div class="form-row">
      <input id="w-url" placeholder="https://..."><input id="w-secret" placeholder="secret">
      <input id="w-events" placeholder="events (comma, empty=all)">
      <button onclick="createWebhook()">Add webhook</button>
    </div>
    <table id="webhooks"></table>
  </section>

  <section id="tab-metrics">
    <div id="metrics-cards" class="cards"></div>
    <h3>Raw /v1/metrics</h3>
    <pre id="metrics-raw"></pre>
  </section>

  <section id="tab-backup">
    <div class="form-row">
      <button onclick="backup()">Create snapshot</button>
      <input id="restore-file" type="file" accept="application/json"><button onclick="restore()">Restore from file</button>
    </div>
    <div id="backup-out"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let token = localStorage.getItem("to_token") || "";
if (token) { $("token").value = token; }

function login() {
  token = $("token").value.trim();
  localStorage.setItem("to_token", token);
  flash(token ? "connected" : "token cleared");
  loadAll();
}

function flash(msg, cls) { $("flash").textContent = msg; $("flash").className = cls || "muted"; }

async function api(method, path, body, rawBody) {
  const opts = { method, headers: {} };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (rawBody) { opts.headers["Content-Type"] = "application/json"; opts.body = rawBody; }
  else if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(path, opts);
  const text = await r.text();
  let j = null;
  try { j = JSON.parse(text); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || r.status + " " + text);
  return j === null ? text : j;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function tab(name) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  $("tab-" + name).classList.add("active");
  document.querySelector('nav button[data-tab="' + name + '"]').classList.add("active");
  if (name === "overview") loadOrgs();
  if (name === "org" && $("org-select").value) loadOrg();
  if (name === "audit") audit();
  if (name === "users") loadUsers();
  if (name === "webhooks") loadWebhooks();
  if (name === "metrics") loadMetrics();
}

// ---- overview / orgs
async function loadOrgs() {
  try {
    const d = await api("GET", "/v1/orgs");
    $("org-cards").innerHTML = d.orgs.map(o =>
      `<div class="card" onclick="pickOrg('${esc(o.id)}')">
        <h3>${esc(o.name)} <span class="hash">${esc(o.id)}</span></h3>
        <div><span class="badge ${o.detected ? "detected" : "healthy"}">${o.detected ? "DETECTED" : "healthy"}</span></div>
        <div class="stat">${o.events} events · created ${new Date(o.created * 1000).toISOString().slice(0, 10)}</div>
      </div>`).join("");
    const sel = $("org-select");
    sel.innerHTML = d.orgs.map(o => `<option value="${esc(o.id)}">${esc(o.name)}</option>`).join("");
    if (d.orgs.length) pickOrg(d.orgs[0].id);
  } catch (e) { flash(e.message, "err"); }
}

async function createOrg() {
  const name = $("new-org").value.trim();
  if (!name) return;
  try { await api("POST", "/v1/orgs", { name }); $("new-org").value = ""; loadOrgs(); flash("org created", "ok"); }
  catch (e) { flash(e.message, "err"); }
}

function pickOrg(id) { $("org-select").value = id; tab("org"); }

// ---- org detail
async function loadOrg() {
  const org = $("org-select").value;
  if (!org) return;
  try {
    const d = await api("GET", "/v1/orgs/" + org);
    $("org-head").innerHTML = `<h3>${esc(d.name)} <span class="badge ${d.detected ? "detected" : "healthy"}">${d.detected ? "DETECTED" : "healthy"}</span></h3>`;
    const tl = await api("GET", "/v1/orgs/" + org + "/timeline?limit=100");
    $("timeline").innerHTML = "<tr><th>type</th><th>ts</th><th>cert</th><th>identity</th><th>via</th><th>hash</th></tr>" +
      tl.events.map(e => `<tr><td>${esc(e.type)}</td><td>${new Date(e.ts * 1000).toISOString()}</td>
        <td>${esc(e.cert_id || "")}</td><td>${esc(e.identity || "")}</td><td>${esc(e.via || "")}</td>
        <td class="hash">${esc(e.hash.slice(0, 16))}</td></tr>`).join("");
    const st = await api("GET", "/v1/orgs/" + org + "/state");
    $("state").innerHTML = "<tr><th>cert</th><th>identity</th><th>status</th></tr>" +
      Object.entries(st.certs).map(([id, c]) => `<tr><td>${esc(id)}</td><td>${esc(c.Identity)}</td>
        <td class="${c.Revoked ? "err" : "ok"}">${c.Revoked ? "revoked" : "valid"}</td></tr>`).join("");
  } catch (e) { flash(e.message, "err"); }
}

async function issueCert() {
  const org = $("org-select").value, cert = $("i-cert").value.trim(), id = $("i-id").value.trim();
  if (!org || !cert || !id) return flash("cert_id + identity required", "err");
  try { await api("POST", `/v1/orgs/${org}/issue`, { cert_id: cert, identity: id, via: $("i-via").value.trim() });
    $("i-cert").value = $("i-id").value = $("i-via").value = ""; loadOrg(); flash("issued " + cert, "ok"); }
  catch (e) { flash(e.message, "err"); }
}

async function revokeCert() {
  const org = $("org-select").value, cert = $("r-cert").value.trim();
  if (!org || !cert) return flash("cert_id required", "err");
  try { await api("POST", `/v1/orgs/${org}/revoke`, { cert_id: cert });
    $("r-cert").value = ""; loadOrg(); flash("revoked " + cert, "ok"); }
  catch (e) { flash(e.message, "err"); }
}

async function postScore() {
  const org = $("org-select").value, node = $("s-node").value.trim(), score = parseFloat($("s-score").value);
  if (!org || !node) return flash("node_id required", "err");
  const evidence = $("s-bad").value ? { bad_index: parseInt($("s-bad").value) } : null;
  try { await api("POST", `/v1/orgs/${org}/scores`, { node_id: node, score, p_value: score < 25 ? 0.01 : 1, evidence });
    flash("score " + node + "=" + score + " ingested", "ok"); setTimeout(loadOrg, 300); }
  catch (e) { flash(e.message, "err"); }
}

async function recover() {
  const org = $("org-select").value;
  let shards;
  try { shards = JSON.parse($("shards").value); } catch (e) { return flash("shards must be JSON", "err"); }
  try { const d = await api("POST", `/v1/orgs/${org}/recover`, { shards });
    flash(`recovered: epoch ${d.epoch}, ${d.issued.length} re-issued, verify=${d.verify}`, d.verify ? "ok" : "err");
    loadOrg(); }
  catch (e) { flash(e.message, "err"); }
}

async function getKeys() {
  const org = $("org-select").value;
  try { const d = await api("GET", `/v1/orgs/${org}/keys`);
    flash(`seed ${d.seed_b64.slice(0, 24)}… — ${d.ceremony}`, "ok"); }
  catch (e) { flash(e.message, "err"); }
}

async function deleteOrg() {
  const org = $("org-select").value;
  if (!confirm("Delete org " + org + "? Files move to data/trash.")) return;
  try { await api("DELETE", "/v1/orgs/" + org); flash("deleted " + org, "ok"); loadOrgs(); }
  catch (e) { flash(e.message, "err"); }
}

// ---- audit
async function audit() {
  const q = new URLSearchParams();
  if ($("a-org").value.trim()) q.set("org", $("a-org").value.trim());
  if ($("a-type").value.trim()) q.set("type", $("a-type").value.trim());
  if ($("a-identity").value.trim()) q.set("identity", $("a-identity").value.trim());
  if ($("a-cert").value.trim()) q.set("cert", $("a-cert").value.trim());
  q.set("limit", "200");
  try {
    const d = await api("GET", "/v1/audit?" + q);
    $("audit-results").innerHTML = `<table><tr><th>org</th><th>type</th><th>ts</th><th>cert</th><th>identity</th><th>hash</th></tr>` +
      d.events.map(e => `<tr><td>${esc(e.org)}</td><td>${esc(e.type)}</td><td>${new Date(e.ts * 1000).toISOString()}</td>
        <td>${esc(e.cert_id || "")}</td><td>${esc(e.identity || "")}</td><td class="hash">${esc(e.hash.slice(0, 16))}</td></tr>`).join("") + "</table>";
  } catch (e) { flash(e.message, "err"); }
}

// ---- users
async function loadUsers() {
  try {
    const d = await api("GET", "/v1/users");
    $("users").innerHTML = "<tr><th>id</th><th>role</th><th>orgs</th><th>tokens</th></tr>" +
      d.users.map(u => `<tr><td>${esc(u.id)}</td><td>${esc(u.role)}</td><td>${esc((u.orgs || []).join(", ") || "all")}</td><td>${u.tokens}</td></tr>`).join("");
  } catch (e) { flash(e.message, "err"); }
}

async function createUser() {
  const id = $("u-id").value.trim(), role = $("u-role").value;
  const orgs = $("u-orgs").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!id) return;
  try { const d = await api("POST", "/v1/users", { id, role, orgs });
    flash(`user ${id} created — token: ${d.token}`, "ok"); $("u-id").value = ""; loadUsers(); }
  catch (e) { flash(e.message, "err"); }
}

// ---- webhooks
async function loadWebhooks() {
  try {
    const d = await api("GET", "/v1/webhooks");
    $("webhooks").innerHTML = "<tr><th>id</th><th>url</th><th>events</th><th></th></tr>" +
      d.webhooks.map(w => `<tr><td class="hash">${esc(w.ID)}</td><td>${esc(w.URL)}</td>
        <td>${esc((w.Events || []).join(",") || "all")}</td>
        <td><button onclick="deleteWebhook('${esc(w.ID)}')">delete</button></td></tr>`).join("");
  } catch (e) { flash(e.message, "err"); }
}

async function createWebhook() {
  const url = $("w-url").value.trim();
  if (!url) return flash("url required", "err");
  const events = $("w-events").value.split(",").map(s => s.trim()).filter(Boolean);
  try { await api("POST", "/v1/webhooks", { url, secret: $("w-secret").value, events });
    $("w-url").value = $("w-secret").value = $("w-events").value = ""; loadWebhooks(); flash("webhook added", "ok"); }
  catch (e) { flash(e.message, "err"); }
}

async function deleteWebhook(id) {
  try { await api("DELETE", "/v1/webhooks/" + id); loadWebhooks(); }
  catch (e) { flash(e.message, "err"); }
}

// ---- metrics
async function loadMetrics() {
  try {
    const orgs = await api("GET", "/v1/orgs");
    $("metrics-cards").innerHTML = orgs.orgs.map(o => `<div class="card"><h3>${esc(o.name)}</h3>
      <div class="stat">${o.events} events · ${o.detected ? "DETECTED" : "healthy"}</div></div>`).join("");
    const raw = await api("GET", "/v1/metrics");
    $("metrics-raw").textContent = raw;
  } catch (e) { flash(e.message, "err"); }
}

// ---- backup
async function backup() {
  try {
    const d = await api("POST", "/v1/backup");
    $("backup-out").innerHTML = `snapshot ${esc(d.id)} (${d.size} bytes) — ` +
      `<a href="${esc(d.download)}" download="backup.json" style="color:var(--acc)">download</a>`;
    flash("backup created", "ok");
  } catch (e) { flash(e.message, "err"); }
}

async function restore() {
  const f = $("restore-file").files[0];
  if (!f) return flash("choose a backup file", "err");
  try {
    const text = await f.text();
    await api("POST", "/v1/restore", undefined, text);
    flash("restored — refresh", "ok");
  } catch (e) { flash(e.message, "err"); }
}

function loadAll() {
  if (!token) return;
  loadOrgs();
}
loadAll();
</script>
</body>
</html>
