{{- range $i, $m := .Values.council.members }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: council-{{ lower $m.id }}
  namespace: {{ $.Values.namespace.name }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: council-{{ lower $m.id }}}
  template:
    metadata:
      labels: {app: council-{{ lower $m.id }}, role: council}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      volumes:
        - name: ca
          secret: {secretName: identity-ca}
        - name: member-tls
          secret: {secretName: council-node-{{ add $i 1 }}}
      containers:
        - name: member
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["/bin/to-council", "serve"]
          args:
            - --id={{ $m.id }}
            - --addr=0.0.0.0:8443
            - --shard=/tls/shard.json
            - --ca=/ca/ca.der
            - --cert=/tls/leaf.der
            - --key=/tls/node.key
          ports: [{containerPort: 8443}]
          volumeMounts:
            - {name: ca, mountPath: /ca, readOnly: true}
            - {name: member-tls, mountPath: /tls, readOnly: true}
          readinessProbe: {tcpSocket: {port: 8443}}
---
apiVersion: v1
kind: Service
metadata:
  name: council-{{ lower $m.id }}
  namespace: {{ $.Values.namespace.name }}
spec:
  selector: {app: council-{{ lower $m.id }}}
  ports: [{port: 8443, targetPort: 8443}]
{{- end }}
