apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: {{ .Values.namespace.name }}
  labels: {{- include "to.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: gateway-data}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/to-gateway"]
          args:
            - -addr=0.0.0.0:8080
            - -data=/data
          env:
            - {name: TO_ADMIN_TOKEN, value: {{ .Values.gateway.adminToken | quote }}}
          ports: [{containerPort: 8080}]
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe: {httpGet: {path: /v1/health, port: 8080}}
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: {{ .Values.namespace.name }}
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app: gateway}
  ports: [{port: {{ .Values.gateway.service.port }}, targetPort: 8080}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gateway-data
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{ .Values.gateway.storage }}}}
{{- if .Values.gateway.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: {{ .Values.namespace.name }}
spec:
  {{- with .Values.gateway.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.gateway.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port: {number: {{ .Values.gateway.service.port }}}
{{- end }}
