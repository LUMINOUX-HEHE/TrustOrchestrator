# Default deny, mTLS ports only (mirrors deploy/kubernetes.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-api
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels: {app: gateway}
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fleet-ingest
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels: {app: orchestrator}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {role: watchdog}}
      ports: [{port: 8333}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-council-vote
  namespace: {{ .Values.namespace.name }}
spec:
  podSelector:
    matchLabels: {role: council}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {role: council}}
        - podSelector: {matchLabels: {app: orchestrator}}
      ports: [{port: 8443}]
