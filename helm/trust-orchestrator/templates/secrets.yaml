# Bootstrap material (values.secrets.*): same layout as deploy/kubernetes.yaml,
# as Secrets so pods never see the raw values.
apiVersion: v1
kind: Secret
metadata:
  name: identity-ca
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  ca.key: {{ .Values.secrets.identityCa.caKey | quote }}
  ca.der: {{ .Values.secrets.identityCa.caDer | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: orchestrator-node
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  node.key: {{ .Values.secrets.orchestratorNode.nodeKey | quote }}
  leaf.der: {{ .Values.secrets.orchestratorNode.leaf | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: watchdog-node
  namespace: {{ .Values.namespace.name }}
type: Opaque
stringData:
  node.key: {{ .Values.secrets.watchdogNode.nodeKey | quote }}
  leaf.der: {{ .Values.secrets.watchdogNode.leaf | quote }}
{{- range $i, $m := .Values.council.members }}
---
apiVersion: v1
kind: Secret
metadata:
  name: council-node-{{ add $i 1 }}
  namespace: {{ $.Values.namespace.name }}
type: Opaque
stringData:
  shard.json: {{ $m.shard | quote }}
  node.key: {{ $m.nodeKey | quote }}
  leaf.der: {{ $m.leaf | quote }}
{{- end }}
