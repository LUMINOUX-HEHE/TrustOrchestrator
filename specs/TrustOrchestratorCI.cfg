\* Scale-reduced config for CI (2-vCPU runners): same invariants, smaller
\* instance. The full-scale config (TrustOrchestrator.cfg) is the published
\* evidence; this one exists so a push can't ship a broken invariant
\* overnight. Safety properties are scale-independent (the main model is
\* already reduced from 5/3 to 3/2 for the same reason).
SPECIFICATION Spec

CONSTANTS
    Certs = {c1, c2}
    Council = {m1, m2}
    Quorum = 2
    Watchdogs = {w1, w2}
    DetectQuorum = 2
    Auditors = {a1, a2}
    EscalateQuorum = 2
    Identities = {id1, id2}

CONSTRAINT BoundedEpoch

INVARIANT Safety

CHECK_DEADLOCK FALSE
